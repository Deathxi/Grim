name: Deploy Grim

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        # Pin appleboy/ssh-action@v1.2.0 by commit SHA (supply-chain hardening).
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          # Optional but strongly recommended — set VPS_SSH_FINGERPRINT to the
          # Droplet host key (ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub).
          # Empty secret keeps prior behavior; set it to block MITM.
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          script_stop: true
          script: |
            set -euo pipefail
            export PIP_NO_INPUT=1
            cd /root/grim
            # Hard reset + disable client hooks so a planted post-merge cannot run.
            git fetch origin main
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=core.hooksPath \
              GIT_CONFIG_VALUE_0=/dev/null \
              git reset --hard origin/main
            # Ensure runtime data path exists before the hardened unit binds it.
            install -d -m 700 /root/.grim_data
            # Refresh units from git so sandbox directives stay current.
            if [ -f /root/grim/systemd/grim.service ]; then
              install -m 644 /root/grim/systemd/grim.service /etc/systemd/system/grim.service
            fi
            if [ -f /root/grim/systemd/grim-backup.service ]; then
              install -m 644 /root/grim/systemd/grim-backup.service /etc/systemd/system/grim-backup.service
            fi
            if [ -f /root/grim/systemd/grim-backup.timer ]; then
              install -m 644 /root/grim/systemd/grim-backup.timer /etc/systemd/system/grim-backup.timer
            fi
            systemctl daemon-reload
            pip3 install -q -r /root/grim/requirements.txt
            systemctl reset-failed grim || true
            systemctl restart grim
            sleep 5
            if systemctl is-active --quiet grim; then
              echo "Grim redeployed successfully"
            else
              echo "ERROR: Grim failed to start after deploy" >&2
              # Avoid dumping service journals into public Actions logs.
              systemctl status grim --no-pager || true
              exit 1
            fi
