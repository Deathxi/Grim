name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Face-only layout
        run: |
          test -f README.md
          grep -q 'Terms of Service' README.md
          grep -q 'Privacy Policy' README.md
          test ! -f main.py
          test ! -f requirements.txt
          test ! -f .github/workflows/deploy.yml
          test ! -d tests
          test ! -d systemd
          test ! -d scripts
          test ! -d zork
